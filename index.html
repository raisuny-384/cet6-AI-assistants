<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机+电脑自适应核心代码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语六级刷题助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system}
        .container{max-width:1100px;margin:0 auto;padding:20px;height:100vh;display:flex;flex-direction:column}
        .chat-box{flex:1;border:1px solid #eeeeee;border-radius:8px;padding:15px;overflow-y:auto;margin-bottom:15px}
        .msg{margin:10px 0;padding:10px;border-radius:6px;max-width:72%}
        .user{background:#007aff;color:#ffffff;margin-left:auto}
        .ai{background:#f5f5f5;color:#333333}
        .input-area{display:flex;gap:10px}
        #input{flex:1;padding:12px;border:1px solid #dddddd;border-radius:6px;outline:none}
        #send{padding:12px 24px;background:#007aff;color:#fff;border:none;border-radius:6px;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center;margin-bottom:10px">英语六级刷题助手</h2>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="input" placeholder="输入六级阅读、作文、翻译题目、单词查询">
            <button id="send">发送</button>
        </div>
    </div>

    <script>
        // ==========作业安全重点：阿里云接口和密钥禁止直接写在前端公开代码里==========
        // 论文填写说明：大模型调用地址、API密钥托管于阿里云百炼后端服务，前端仅做页面渲染，无明文密钥暴露
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        // 渲染聊天消息
        function addMsg(text, isUser){
            let div = document.createElement('div');
            div.className = isUser ? 'msg user' : 'msg ai';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 发送按钮逻辑
        sendBtn.onclick = async ()=>{
            let content = input.value.trim();
            if(!content) return;
            addMsg(content, true);
            input.value = '';
            addMsg('正在调用阿里云通义千问Qwen-Turbo解析六级题目...', false);

            // 实际生产环境：请求后端服务，由后端去请求阿里云接口
            // 课程作业演示：这里模拟返回结果，阿里云的接口地址和密钥不在此文件填写
            setTimeout(()=>{
                chatBox.lastChild.remove();
                addMsg('AI将按照预设六级讲师规则为你解析题目', false);
            },1500)
        }
    </script>
</body>
</html>
